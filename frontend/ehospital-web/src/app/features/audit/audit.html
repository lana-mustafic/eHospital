<div class="audit">
  <div class="audit-tabs">
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'trail'"
      (click)="setTab('trail')">
      <span class="material-icons">history</span>
      Audit Trail
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'compliance'"
      (click)="setTab('compliance')">
      <span class="material-icons">assessment</span>
      Compliance Report
    </button>
  </div>

  <div class="audit-content">
    @if (activeTab === 'trail') {
      <app-audit-trail></app-audit-trail>
    } @else if (activeTab === 'compliance') {
      <app-compliance-report></app-compliance-report>
    }
  </div>
</div>
