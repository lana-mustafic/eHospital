<div class="advanced-filters-panel" *ngIf="isOpen">
  <div class="panel-header">
    <h3>Advanced Filters</h3>
    <button class="btn-close" (click)="closePanel()" title="Close">
      <span class="material-icons">close</span>
    </button>
  </div>

  <div class="panel-content">
    <!-- Quick Filters -->
    <div class="filter-section">
      <h4>Quick Filters</h4>
      <div class="quick-filters">
        <button
          *ngFor="let filter of quickFilters"
          class="quick-filter-btn"
          [class.active]="activeQuickFilter === filter.type"
          (click)="applyQuickFilter(filter.type)">
          {{ filter.label }}
        </button>
      </div>
    </div>

    <!-- Saved Filters -->
    <div class="filter-section" *ngIf="savedFilters.length > 0">
      <div class="section-header">
        <h4>Saved Filters</h4>
        <button class="btn-link" (click)="openSaveFilterModal()" title="Save current filter">
          <span class="material-icons">bookmark_add</span>
        </button>
      </div>
      <div class="saved-filters">
        <div
          *ngFor="let savedFilter of savedFilters"
          class="saved-filter-item"
          (click)="loadSavedFilter(savedFilter)">
          <span class="filter-name">{{ savedFilter.name }}</span>
          <button
            class="btn-icon-small"
            (click)="deleteSavedFilter(savedFilter.id, $event)"
            title="Delete filter">
            <span class="material-icons">delete</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Basic Filters -->
    <div class="filter-section">
      <h4>Basic Filters</h4>
      <div class="form-group">
        <label>Gender</label>
        <select formControlName="gender">
          <option value="">All Genders</option>
          <option *ngFor="let gender of genders" [value]="gender">{{ gender }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Blood Type</label>
        <select formControlName="bloodType">
          <option value="">All Blood Types</option>
          <option *ngFor="let type of bloodTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Department</label>
        <select formControlName="department">
          <option value="">All Departments</option>
          <option *ngFor="let dept of departments" [value]="dept.name">{{ dept.name }}</option>
        </select>
      </div>
    </div>

    <!-- Date Range Filters -->
    <div class="filter-section">
      <h4>Date Ranges</h4>
      <div class="form-group">
        <label>Date of Birth (From)</label>
        <input type="date" formControlName="dateOfBirthFrom" />
      </div>
      <div class="form-group">
        <label>Date of Birth (To)</label>
        <input type="date" formControlName="dateOfBirthTo" />
      </div>
      <div class="form-group">
        <label>Registration Date (From)</label>
        <input type="date" formControlName="registrationDateFrom" />
      </div>
      <div class="form-group">
        <label>Registration Date (To)</label>
        <input type="date" formControlName="registrationDateTo" />
      </div>
    </div>

    <!-- Age Range -->
    <div class="filter-section">
      <h4>Age Range</h4>
      <div class="form-row">
        <div class="form-group">
          <label>From</label>
          <input type="number" formControlName="ageFrom" min="0" placeholder="Min age" />
        </div>
        <div class="form-group">
          <label>To</label>
          <input type="number" formControlName="ageTo" min="0" placeholder="Max age" />
        </div>
      </div>
    </div>

    <!-- Additional Filters -->
    <div class="filter-section">
      <h4>Additional Filters</h4>
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasEmergencyContact" />
          <span>Has Emergency Contact</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasBloodType" />
          <span>Has Blood Type</span>
        </label>
      </div>
    </div>
  </div>

  <div class="panel-footer">
    <button class="btn-secondary" (click)="clearFilters()">Clear All</button>
    <button class="btn-link" (click)="openSaveFilterModal()">
      <span class="material-icons">bookmark_add</span>
      Save Filter
    </button>
  </div>
</div>

<!-- Save Filter Modal -->
<div class="modal-overlay" *ngIf="showSaveFilterModal" (click)="closeSaveFilterModal()">
  <div class="modal-content modal-small" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Save Filter</h3>
      <button class="btn-close" (click)="closeSaveFilterModal()">
        <span class="material-icons">close</span>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Filter Name</label>
        <input
          type="text"
          [(ngModel)]="saveFilterName"
          placeholder="Enter filter name"
          (keyup.enter)="saveCurrentFilter()"
          #nameInput />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" (click)="closeSaveFilterModal()">Cancel</button>
      <button class="btn-primary" (click)="saveCurrentFilter()" [disabled]="!saveFilterName.trim()">
        Save
      </button>
    </div>
  </div>
</div>
