<div class="my-appointments">
  <div *ngIf="isLoading" class="loading">Loading...</div>
  <table *ngIf="!isLoading" class="table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Doctor</th>
        <th>Status</th>
        <th>Reason</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of appointments">
        <td>{{ a.appointmentDate }}</td>
        <td>{{ a.startTime }} - {{ a.endTime }}</td>
        <td>{{ a.doctorName }}</td>
        <td>{{ a.status }}</td>
        <td>{{ a.reason || '—' }}</td>
        <td class="actions" *ngIf="a.status === 'Scheduled'">
          <button class="btn-secondary" (click)="cancel(a)">Cancel</button>
          <button class="btn-primary" (click)="openReschedule(a)">Reschedule</button>
        </td>
      </tr>
      <tr *ngIf="appointments.length === 0">
        <td colspan="6" class="empty">No appointments found</td>
      </tr>
    </tbody>
  </table>

  <div class="modal" *ngIf="showReschedule">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>Reschedule Appointment</h3>
      <form (ngSubmit)="submitReschedule()">
        <div class="row">
          <label>Date</label>
          <input type="date" [(ngModel)]="rescheduleDate" name="date" required (change)="onDateChange()" />
        </div>
        <div class="row slots">
          <label>Available slots</label>
          <div class="slot-list">
            <button type="button"
                    class="slot"
                    *ngFor="let s of slots"
                    [disabled]="!s.available"
                    [class.selected]="s.start === rescheduleStart && s.end === rescheduleEnd"
                    (click)="selectSlot(s)">
              {{ s.start.slice(0,5) }} - {{ s.end.slice(0,5) }}
            </button>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary">Save</button>
          <button type="button" class="btn-secondary" (click)="closeReschedule()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
