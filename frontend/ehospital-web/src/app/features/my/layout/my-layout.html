<div class="my-layout">
  <header class="my-header">
    <div class="header-left">
      <div class="logo-section">
        <div class="logo-icon">
          <span class="material-icons">local_hospital</span>
        </div>
        <div class="logo-text">
          <h2>eHospital</h2>
          <span class="portal-label">{{ getPortalLabel() }}</span>
        </div>
      </div>
    </div>
    
    <nav class="my-nav">
      <a routerLink="/my/home" routerLinkActive="active" class="nav-link">
        <span class="material-icons">home</span>
        <span class="nav-text">Home</span>
      </a>
      <a routerLink="/my/appointments" routerLinkActive="active" class="nav-link">
        <span class="material-icons">event</span>
        <span class="nav-text">Appointments</span>
      </a>
      <a routerLink="/my/profile" routerLinkActive="active" class="nav-link">
        <span class="material-icons">person</span>
        <span class="nav-text">Profile</span>
      </a>
    </nav>
    
    <div class="header-right">
      <div class="user-section" *ngIf="currentUser">
        <div class="user-avatar">
          <span class="material-icons">account_circle</span>
        </div>
        <div class="user-info">
          <span class="user-name">{{ currentUser.name }}</span>
          <span class="user-role">{{ currentUser.role }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Logout" type="button">
        <span class="material-icons">logout</span>
      </button>
    </div>
  </header>
  <main class="my-content">
    <router-outlet></router-outlet>
  </main>
</div>
