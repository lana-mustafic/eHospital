<div class="my-layout">
  <header class="my-header">
    <h2>My Portal</h2>
    <nav class="my-nav">
      <a routerLink="/my/home" routerLinkActive="active">Home</a>
      <a routerLink="/my/appointments" routerLinkActive="active">Appointments</a>
      <a routerLink="/my/profile" routerLinkActive="active">Profile</a>
    </nav>
    <div class="header-right">
      <div class="user-info" *ngIf="currentUser">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-role">{{ currentUser.role }}</span>
      </div>
      <button class="logout-btn" (click)="logout()" title="Logout" type="button">
        <span class="material-icons">logout</span>
        <span>Logout</span>
      </button>
    </div>
  </header>
  <main class="my-content">
    <router-outlet></router-outlet>
  </main>
</div>
