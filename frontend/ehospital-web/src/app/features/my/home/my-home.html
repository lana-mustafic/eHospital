<div class="my-home">
  <div *ngIf="isLoading" class="loading">Loading...</div>

  <section *ngIf="me" class="card">
    <h3>Welcome, {{ me.firstName }} {{ me.lastName }}</h3>
    <p>Email: {{ me.email }}</p>
    <p>Phone: {{ me.phoneNumber }}</p>
  </section>

  <section class="card">
    <app-appointment-reminders [daysAhead]="7" [maxItems]="5" [showForCurrentUser]="true"></app-appointment-reminders>
  </section>
</div>
