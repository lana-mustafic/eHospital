<div class="distribution-container">
  @if (title) {
    <h3 class="chart-title">{{ title }}</h3>
  }
  <div class="chart-wrapper">
    <svg [attr.viewBox]="'0 0 ' + width + ' ' + height" class="distribution-chart">
      <!-- Grid lines -->
      <g class="grid-lines">
        @for (line of getGridLines(); track line.y) {
          <line
            [attr.x1]="padding.left"
            [attr.y1]="line.y"
            [attr.x2]="padding.left + chartWidth"
            [attr.y2]="line.y"
            stroke="#e5e7eb"
            stroke-width="1"
            stroke-dasharray="2,2"
          />
          <text
            [attr.x]="padding.left - 10"
            [attr.y]="line.y + 4"
            text-anchor="end"
            class="grid-label"
          >
            {{ line.value }}
          </text>
        }
      </g>

      <!-- Bar chart -->
      @if (chartType === 'bar') {
        <g class="bars">
          @for (bar of bars; track bar.label) {
            <g>
              <rect
                [attr.x]="bar.x"
                [attr.y]="bar.y"
                [attr.width]="bar.width"
                [attr.height]="bar.height"
                [attr.fill]="bar.color"
                rx="4"
                class="bar"
              />
              <text
                [attr.x]="bar.x + bar.width / 2"
                [attr.y]="bar.y - 5"
                text-anchor="middle"
                class="bar-value"
              >
                {{ bar.value }}
              </text>
              <text
                [attr.x]="bar.x + bar.width / 2"
                [attr.y]="height - 10"
                text-anchor="middle"
                class="bar-label"
              >
                {{ bar.label }}
              </text>
            </g>
          }
        </g>
      }

      <!-- Line chart -->
      @if (chartType === 'line') {
        <g class="line-chart">
          <polyline
            [attr.points]="linePoints"
            fill="none"
            stroke="#14b8a6"
            stroke-width="3"
            class="chart-line"
          />
          @for (item of data; track item.label; let i = $index) {
            <circle
              [attr.cx]="padding.left + (i / (data.length - 1 || 1)) * chartWidth"
              [attr.cy]="padding.top + chartHeight - ((item.value / maxValue) * chartHeight)"
              r="5"
              fill="#14b8a6"
              class="data-point"
            />
            <text
              [attr.x]="padding.left + (i / (data.length - 1 || 1)) * chartWidth"
              [attr.y]="height - 10"
              text-anchor="middle"
              class="line-label"
            >
              {{ item.label }}
            </text>
          }
        </g>
      }
    </svg>
  </div>
</div>
