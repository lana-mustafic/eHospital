<div class="wizard-container">
  <!-- Wizard Header -->
  <div class="wizard-header" *ngIf="currentStep">
    <h2 class="wizard-title">{{ currentStep.title }}</h2>
    <p class="wizard-description" *ngIf="currentStep.description">{{ currentStep.description }}</p>
  </div>

  <!-- Progress Indicator -->
  <div class="wizard-progress" *ngIf="showProgress">
    <div class="progress-steps">
      <div 
        *ngFor="let step of steps; let i = index; trackBy: trackByStepId"
        class="step-indicator"
        [class]="getStepStatusClass(step, i)"
        [class.clickable]="canNavigateToStep(i)"
        (click)="canNavigateToStep(i) ? goToStep(i) : null">
        
        <div class="step-circle">
          <span class="step-number" *ngIf="!step.isCompleted">{{ i + 1 }}</span>
          <span class="step-check" *ngIf="step.isCompleted">✓</span>
        </div>
        
        <div class="step-label">
          <span class="step-title">{{ step.title }}</span>
        </div>
        
        <!-- Progress Line -->
        <div class="step-line" *ngIf="i < steps.length - 1"></div>
      </div>
    </div>
    
    <!-- Overall Progress Bar -->
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progressPercentage"></div>
    </div>
    
    <div class="progress-text">
      Step {{ currentStepIndex + 1 }} of {{ steps.length }} ({{ progressPercentage }}% complete)
    </div>
  </div>

  <!-- Step Content -->
  <div class="wizard-content">
    <div class="step-container" *ngIf="currentStep">
      <!-- Content will be projected here -->
      <ng-content></ng-content>
      
      <!-- If using template-based steps -->
      <ng-container *ngIf="currentStep.template" [ngTemplateOutlet]="currentStep.template"></ng-container>
      
      <!-- Default content if no template -->
      <div class="default-step-content" *ngIf="!currentStep.template">
        <h3>{{ currentStep.title }}</h3>
        <p *ngIf="currentStep.description">{{ currentStep.description }}</p>
      </div>
    </div>
  </div>

  <!-- Navigation Controls -->
  <div class="wizard-navigation">
    <div class="nav-left">
      <button 
        type="button" 
        class="btn btn-secondary" 
        (click)="cancelWizard()">
        Cancel
      </button>
    </div>
    
    <div class="nav-right">
      <button 
        type="button" 
        class="btn btn-outline" 
        [disabled]="isFirstStep"
        (click)="prevStep()">
        Previous
      </button>
      
      <button 
        *ngIf="!isLastStep" 
        type="button" 
        class="btn btn-primary" 
        [disabled]="!currentStep?.isValid"
        (click)="nextStep()">
        Next
      </button>
      
      <button 
        *ngIf="isLastStep" 
        type="button" 
        class="btn btn-success" 
        [disabled]="!currentStep?.isValid"
        (click)="finishWizard()">
        Finish
      </button>
    </div>
  </div>
</div>
